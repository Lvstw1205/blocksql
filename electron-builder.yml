appId: io.github.lvstw1205.blocksql
productName: BlockSQL
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Development
publish:
  provider: github
