appId: io.github.lvstw1205.blocksql
productName: BlockSQL
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
afterPack: scripts/adhoc-sign.cjs
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  identity: null
win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
portable:
  artifactName: BlockSQL-${version}-portable.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Development
publish:
  provider: github
